[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dataflow-platform"
version = "0.1.0"
description = "Control plane for scheduling, executing, and monitoring data-collection workloads"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TeamCrawlers" },
]
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "bcrypt>=4.0,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "psycopg2-binary>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.9,<1",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
dataflow-seed-scrapers = "dataflow_platform.seed:main"
dataflow-api = "dataflow_platform.api.main:run"
dataflow-qa-sweep = "dataflow_platform.qa.sweep:main"
dataflow-create-user = "dataflow_platform.create_user:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataflow_platform"]

[tool.hatch.build.targets.wheel.force-include]
"src/dataflow_platform/dashboard/templates" = "dataflow_platform/dashboard/templates"
"src/dataflow_platform/dashboard/static" = "dataflow_platform/dashboard/static"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/dataflow_platform/api/routes.py" = ["B008"]
"src/dataflow_platform/dashboard/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dataflow_platform"]
mypy_path = "src"
