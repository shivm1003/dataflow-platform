# Sample site for https://dashboard.teamcrawlers.com → local dataflow-api.
#
# Install (Debian/Ubuntu sketch):
#   sudo cp deploy/nginx-dashboard.teamcrawlers.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/nginx-dashboard.teamcrawlers.com.conf \
#     /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dashboard.teamcrawlers.com
#
# Certbot rewrites this file to add ssl_certificate lines and the HTTP→HTTPS redirect.
# dataflow-api must listen on 127.0.0.1:8000 (API_HOST=127.0.0.1).

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.teamcrawlers.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
